# 配置示例：复制为 config.yaml 后按需修改
# cp config.example.yaml config.yaml
# config.yaml 已被 .gitignore 忽略，不会提交到仓库
# 所有配置项都支持环境变量覆盖：GO_STARTER_MYSQL_PASSWORD、GO_STARTER_REDIS_ADDR 等

app:
  name: go-starter
  env: dev
  port: 8080

server:
  # 只限制请求头的读取时间，防慢连接；对 SSE / WebSocket 无影响
  read_header_timeout: 10s
  # 读请求体（含上传）的总时限；0 表示不限制
  # WebSocket 升级后仍会沿用这个读 deadline，建议配 0 或在升级后自行清除
  read_timeout: 30s
  # 写响应的总时限；SSE 长连接必须配 0，或在 handler 里用
  # http.NewResponseController(c.Writer).SetWriteDeadline(time.Time{}) 单独取消
  write_timeout: 30s
  # keep-alive 空闲连接回收时间；只作用于请求之间，不影响进行中的长连接
  idle_timeout: 120s
  # 优雅退出等待时间
  shutdown_timeout: 10s
  # 请求头大小上限（字节）
  max_header_bytes: 1048576
  # 可信代理 CIDR；留空表示不信任 X-Forwarded-For，ClientIP 取直连地址
  # 部署在 nginx / 负载均衡后时填写其网段，例如 ["10.0.0.0/8"]
  trusted_proxies: []

cors:
  # "*" 表示允许任意来源；生产建议改成具体域名列表
  allowed_origins: ["*"]
  # 允许携带 Cookie / Authorization 时不能配合 "*"，中间件会自动回显 Origin
  allow_credentials: false

auth:
  # 为空表示不启用 JWT 鉴权；启用时至少 16 个字符
  # 生产环境建议用 GO_STARTER_AUTH_JWT_SECRET 注入，不要写进仓库
  jwt_secret: ""
  jwt_expire: 24h
  jwt_issuer: go-starter

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  dbname: go_starter
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m
  prepare_stmt: false
  slow_threshold: 200ms

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

log:
  level: info
  file: logs/app.log
  # 文件轮转：单个文件最大 MB、保留旧文件数、保留天数、是否压缩
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true
