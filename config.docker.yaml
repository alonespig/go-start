# Docker Compose 环境专用配置：host 指向 compose 服务名
app:
  name: go-starter
  env: dev
  port: 8080

server:
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

mysql:
  host: mysql
  port: 3306
  user: root
  password: root
  dbname: go_starter
  max_idle_conns: 10
  max_open_conns: 100

redis:
  addr: redis:6379
  password: ""
  db: 0

log:
  level: info
  file: ""   # 容器内输出到 stdout，由 docker logs 收集
