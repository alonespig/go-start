# Docker Compose 环境专用配置：host 指向 compose 服务名
app:
  name: go-starter
  env: dev
  port: 8080

server:
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 10s
  max_header_bytes: 1048576
  trusted_proxies: []

cors:
  allowed_origins: ["*"]
  allow_credentials: false

auth:
  jwt_secret: ""   # 生产通过 GO_STARTER_AUTH_JWT_SECRET 注入
  jwt_expire: 24h
  jwt_issuer: go-starter

mysql:
  host: mysql
  port: 3306
  user: root
  password: root
  dbname: go_starter
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m
  prepare_stmt: false
  slow_threshold: 200ms

redis:
  addr: redis:6379
  password: ""
  db: 0

log:
  level: info
  file: ""   # 容器内输出到 stdout，由 docker logs 收集
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true
